name: Test project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run logic and canvas-format tests
        run: npm test
      - name: Check every JavaScript module syntax
        run: |
          for file in *.js; do node --check "$file"; done
          node --check test.mjs
